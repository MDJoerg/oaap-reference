# OAAP reference core stack — gateway, identity, portal.
# Started by install.sh with --project-directory pointing at this file's
# directory; configuration comes from the generated .env next to it.

services:
  gateway:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${OAAP_HTTP_PORT}:80"
      # TLS for registered external hostnames (RFC-0005 level 3);
      # unused (and firewalled) until 'oaap external set' is run
      - "443:443"
      # RFC-0005 level 1: one gateway listener port per app instance
      - "8100-8199:8100-8199"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps-caddy:/etc/caddy/apps:ro
      # RFC-0035: shared platform assets served directly by the
      # gateway, e.g. /platform/theme.css -- no app-facing service.
      - ./static:/etc/caddy/static:ro
      # ACME account/certificates must survive container recreation
      - "${OAAP_DATA_DIR}/data/gateway/caddy-data:/data"
      # access log of the external sites (portal shows the last hit)
      - "${OAAP_DATA_DIR}/data/gateway/logs:/logs"
    depends_on:
      - identity
      - portal

  identity:
    build: ./services/identity
    restart: unless-stopped
    environment:
      SESSION_SECRET: "${SESSION_SECRET}"
      SETUP_TOKEN: "${SETUP_TOKEN}"
      # Proves that a caller of /internal/* is the portal. Being on this
      # network no longer proves anything — every app instance is on it
      # too (RFC-0015 addendum A4). Held by these two services only.
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:-}"
    volumes:
      - "${OAAP_DATA_DIR}/data/identity:/data"
      # read-only: external.json — the session cookie must span the
      # app subdomains of the registered external hostname, and
      # tenants.json — identity reads the tenant store, appctl owns it
      - "${OAAP_DATA_DIR}/apps:/platform-apps:ro"
      # writable, and the only thing identity writes outside its own
      # data: the tenant audit log (oaap.core.tenant 1.7). User
      # administration is the one state change that never passes the
      # host, so identity has to be able to append here. Its own
      # directory rather than the registry, which stays read-only.
      - "${OAAP_DATA_DIR}/data/audit:/audit"

  portal:
    build: ./services/portal
    restart: unless-stopped
    environment:
      OAAP_VERSION: "${OAAP_VERSION}"
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:-}"
    volumes:
      # read-only view of the app-instance registry for launchpad tiles
      - "${OAAP_DATA_DIR}/apps:/apps-registry:ro"
      # read-only view of the tenant audit log — the portal shows it and
      # never adds to it (oaap.core.tenant 1.7)
      - "${OAAP_DATA_DIR}/data/audit:/audit:ro"
      # read-only view of the gateway's external access log (health page)
      - "${OAAP_DATA_DIR}/data/gateway/logs:/gateway-logs:ro"
      # deploy hook (runtime spec 2.5): the portal queues requests here,
      # the host-side worker (oaap-deployd path unit) executes them
      - "${OAAP_DATA_DIR}/data/deploy-spool:/deploy-spool"

  # Managed Postgres (oaap.data.store 0.1, RFC-0031 Schritt 1). Gated by
  # the node profile 'store' (RFC-0011, oaap.core.host 2.5) through
  # Compose's own 'profiles:' key -- 'docker compose up -d' without
  # --profile store never starts this, exactly like a node that was
  # never asked to carry it. appctl.py passes --profile store itself,
  # right after 'oaap node add-profile store' and again on every update
  # while the profile is held (platform/migrate.sh).
  store:
    image: pgvector/pgvector:pg16
    profiles: ["store"]
    restart: unless-stopped
    environment:
      # Only used to initialise the superuser on first start. appctl
      # (host-side, 'docker exec') still does every schema/role DDL --
      # the one network client is 'twin' below, and only with a
      # per-tenant schema role, never the superuser (RFC-0031 §7/§8).
      POSTGRES_PASSWORD: "${STORE_SUPERUSER_PASSWORD:-}"
    volumes:
      - "${OAAP_DATA_DIR}/data/store:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No 'ports:' -- deliberate (oaap.data.store 2.1, 4). Still reachable
    # from 'twin' over the compose network by service name; 'ports:'
    # only controls HOST exposure, which stays off.

  # The digital twin (oaap.data.twin 0.1, RFC-0031 Schritt 3) -- the only
  # service an app instance talks to for shared tenant data. Same gate
  # as 'store', because it is nothing without it: no 'store' profile,
  # no twin. Reached through the gateway's '/twin/*' route (Caddyfile),
  # never directly -- an app's own network (RFC-0016) cannot see it.
  twin:
    build: ./services/twin
    profiles: ["store"]
    restart: unless-stopped
    depends_on:
      - store
    environment:
      # The third holder of this key, after identity and portal (RFC-0015
      # addendum A4's posture, applied here for Schritt 5, the twin
      # browser): proves a caller of '/internal/*' IS the portal, since
      # the platform network by itself no longer proves anything.
      # '/twin/*' (the gateway route, RFC-0027 keys) needs no part of
      # this and is unaffected.
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:-}"
    volumes:
      # registry.json (whose tenant/app owns which instance) and
      # twin-secrets.json (the per-tenant schema role/password, written
      # by appctl, read by nobody else) -- both read-only, same posture
      # as identity's own '/platform-apps' mount.
      - "${OAAP_DATA_DIR}/apps:/platform-apps:ro"

  # The MQTT broker (oaap.events.broker 0.1, RFC-0032 D2) -- gated by the
  # node profile 'broker' (RFC-0011), INDEPENDENT of 'store': a
  # back-office tenant has a twin but no reason to run real-time
  # messaging. Every CONNECT and every topic action is checked live
  # against identity (mosquitto-go-auth's http backend, see
  # services/broker/mosquitto.conf.template) -- no local password file,
  # no local ACL file. INTERNAL_API_KEY cannot travel as a header here
  # (the plugin sets none), so it travels in the auth URLs' query string
  # instead -- traffic that never leaves this compose network. The
  # config is generated at container start (the key is unknown at image
  # build time) and written to /tmp, which every user this image runs
  # as can write.
  #
  # Only the internal WebSocket listener (9001) is meant to be reached
  # this way, through the gateway's '/broker/*' route (Caddyfile) --
  # like 'twin', an app's own network (RFC-0016) cannot see it directly.
  # The raw device port (1883, no identity by design -- RFC-0015) is
  # published to the host only when this node ALSO carries 'exposed'
  # (docker-compose.broker-exposed.yml, appctl.py's
  # _broker_compose_files()) -- no 'ports:' here on purpose.
  broker:
    image: iegomez/mosquitto-go-auth:2.0.18
    profiles: ["broker"]
    restart: unless-stopped
    depends_on:
      - identity
    environment:
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:-}"
    volumes:
      - ./services/broker/mosquitto.conf.template:/mosquitto-template/mosquitto.conf.template:ro
      - "${OAAP_DATA_DIR}/data/broker:/mosquitto/data"
    command:
      - /bin/sh
      - -c
      - sed "s/__INTERNAL_API_KEY__/$$INTERNAL_API_KEY/g" /mosquitto-template/mosquitto.conf.template > /tmp/mosquitto.conf && exec /usr/sbin/mosquitto -c /tmp/mosquitto.conf
