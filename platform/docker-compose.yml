# OAAP reference core stack — gateway, identity, portal.
# Started by install.sh with --project-directory pointing at this file's
# directory; configuration comes from the generated .env next to it.

services:
  gateway:
    image: caddy:2
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        # RFC-0038 D5: Docker keeps container logs without any limit
        # unless told otherwise, and no OAAP node configures a
        # daemon.json. The app containers get this at `docker run`
        # (appctl.CONTAINER_LOG_OPTS); the core services need it
        # spelled out here.
        max-size: "10m"
        max-file: "3"
    ports:
      - "${OAAP_HTTP_PORT}:80"
      # TLS for registered external hostnames (RFC-0005 level 3);
      # unused (and firewalled) until 'oaap external set' is run
      - "443:443"
      # RFC-0005 level 1: one gateway listener port per app instance
      - "8100-8199:8100-8199"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps-caddy:/etc/caddy/apps:ro
      # RFC-0035: shared platform assets served directly by the
      # gateway, e.g. /platform/theme.css -- no app-facing service.
      - ./static:/etc/caddy/static:ro
      # RFC-0042 T3: the tenant logos, projected out of the byte store by
      # appctl. INSIDE the static directory on purpose -- that puts them
      # on the already-public /platform/* route, which is the only way
      # the LOGIN page can show one (it has no session by definition).
      # Read-only here, written only on the host, and rebuildable: the
      # file that counts lives in oaap.data.files.
      #
      # ./static/place MUST exist in the image's source tree (it does,
      # with a .gitkeep that explains itself): ./static above is a
      # read-only bind mount, and Docker cannot CREATE a mountpoint
      # inside one. Without the directory the gateway refuses to start
      # and the whole node is dark -- measured on oaap-test 2026-09-23.
      - "${OAAP_DATA_DIR}/data/gateway/place:/etc/caddy/static/place:ro"
      # ACME account/certificates must survive container recreation
      - "${OAAP_DATA_DIR}/data/gateway/caddy-data:/data"
      # access log of the external sites (portal shows the last hit)
      - "${OAAP_DATA_DIR}/data/gateway/logs:/logs"
    depends_on:
      - identity
      - portal

  identity:
    # Context is the whole services/ directory, not identity/, so that
    # this image and the portal's can hold the SAME place.py -- which
    # tenant a host names, and what its face is (RFC-0042 T2/T3). Two
    # copies of that judgement is how a login page ends up wearing one
    # club's colours in front of another club's portal.
    build:
      context: ./services
      dockerfile: identity/Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        # RFC-0038 D5: Docker keeps container logs without any limit
        # unless told otherwise, and no OAAP node configures a
        # daemon.json. The app containers get this at `docker run`
        # (appctl.CONTAINER_LOG_OPTS); the core services need it
        # spelled out here.
        max-size: "10m"
        max-file: "3"
    environment:
      SESSION_SECRET: "${SESSION_SECRET}"
      SETUP_TOKEN: "${SETUP_TOKEN}"
      # Proves that a caller of /internal/* is the portal. Being on this
      # network no longer proves anything — every app instance is on it
      # too (RFC-0015 addendum A4). Held by these two services only.
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:-}"
      # Checks the outbox relay's broker login (oaap.data.twin 0.3,
      # principal 'oaap.relay'). Held by identity and 'relay' only --
      # never by the broker, which only asks identity, nor by 'twin'.
      BROKER_RELAY_KEY: "${BROKER_RELAY_KEY:-}"
    volumes:
      - "${OAAP_DATA_DIR}/data/identity:/data"
      # read-only: external.json — the session cookie must span the
      # app subdomains of the registered external hostname, and
      # tenants.json — identity reads the tenant store, appctl owns it
      - "${OAAP_DATA_DIR}/apps:/platform-apps:ro"
      # read-only, and deliberately NOT a corner of /platform-apps:
      # the OIDC client secrets of the tenants' identity providers
      # (RFC-0041 3). The portal mounts /platform-apps as well, so a
      # secret placed there would be readable by a second service for
      # no reason. Its own directory keeps the list of readers at one,
      # and read-only keeps identity from ever writing it -- appctl on
      # the host owns this file, exactly as it owns tenants.json.
      - "${OAAP_DATA_DIR}/data/idp:/platform-idp:ro"
      # writable, and the only thing identity writes outside its own
      # data: the tenant audit log (oaap.core.tenant 1.7). User
      # administration is the one state change that never passes the
      # host, so identity has to be able to append here. Its own
      # directory rather than the registry, which stays read-only.
      - "${OAAP_DATA_DIR}/data/audit:/audit"

  portal:
    # See identity above: one place.py, two images.
    build:
      context: ./services
      dockerfile: portal/Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        # RFC-0038 D5: Docker keeps container logs without any limit
        # unless told otherwise, and no OAAP node configures a
        # daemon.json. The app containers get this at `docker run`
        # (appctl.CONTAINER_LOG_OPTS); the core services need it
        # spelled out here.
        max-size: "10m"
        max-file: "3"
    environment:
      OAAP_VERSION: "${OAAP_VERSION}"
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:-}"
    volumes:
      # read-only view of the app-instance registry for launchpad tiles
      - "${OAAP_DATA_DIR}/apps:/apps-registry:ro"
      # read-only view of the tenant audit log — the portal shows it and
      # never adds to it (oaap.core.tenant 1.7)
      - "${OAAP_DATA_DIR}/data/audit:/audit:ro"
      # read-only view of the gateway's external access log (health page)
      - "${OAAP_DATA_DIR}/data/gateway/logs:/gateway-logs:ro"
      # deploy hook (runtime spec 2.5): the portal queues requests here,
      # the host-side worker (oaap-deployd path unit) executes them
      - "${OAAP_DATA_DIR}/data/deploy-spool:/deploy-spool"
      # read-only: what the connector service reports -- tunnels,
      # connectors, offers (oaap.net.connector 2.7). Its own directory,
      # never the one with the keys next to it.
      - "${OAAP_DATA_DIR}/data/connect/state:/connect-state:ro"

  # The tunnel (oaap.net.connector 0.1, RFC-0033 stage 2). One service,
  # two roles, decided by what the operator configured: OUTER when this
  # node issued connect keys (inner nodes dial in through the gateway's
  # public /connect/tunnel), INNER when it has connectors (it dials out
  # and answers from its offer list). Idle when neither -- which is why
  # it carries no profile: a node becomes an outer or inner node by a
  # command, not by an update.
  #
  # No 'ports:' -- deliberate. The gateway reaches it over this compose
  # network; /via (the destination listener's door) refuses anything
  # without the gateway's key, and the inner role has no listener at all.
  connect:
    build: ./services/connect
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        # RFC-0038 D5: Docker keeps container logs without any limit
        # unless told otherwise, and no OAAP node configures a
        # daemon.json. The app containers get this at `docker run`
        # (appctl.CONTAINER_LOG_OPTS); the core services need it
        # spelled out here.
        max-size: "10m"
        max-file: "3"
    volumes:
      # connect.json (key hashes, connectors, offers) -- read-only, the
      # same mount identity and twin have; appctl owns the file
      - "${OAAP_DATA_DIR}/apps:/platform-apps:ro"
      # the inner side's keys in the clear and the gateway's /via key --
      # read-only, and mounted by NO other container (the posture of
      # data/destinations and data/idp)
      - "${OAAP_DATA_DIR}/data/connect/secrets:/secrets:ro"
      # the one thing it writes: state.json and the stream logs
      - "${OAAP_DATA_DIR}/data/connect/state:/state"

  # Managed Postgres (oaap.data.store 0.1, RFC-0031 Schritt 1). Gated by
  # the node profile 'store' (RFC-0011, oaap.core.host 2.5) through
  # Compose's own 'profiles:' key -- 'docker compose up -d' without
  # --profile store never starts this, exactly like a node that was
  # never asked to carry it. appctl.py passes --profile store itself,
  # right after 'oaap node add-profile store' and again on every update
  # while the profile is held (platform/migrate.sh).
  store:
    image: pgvector/pgvector:pg16
    profiles: ["store"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        # RFC-0038 D5: Docker keeps container logs without any limit
        # unless told otherwise, and no OAAP node configures a
        # daemon.json. The app containers get this at `docker run`
        # (appctl.CONTAINER_LOG_OPTS); the core services need it
        # spelled out here.
        max-size: "10m"
        max-file: "3"
    environment:
      # Only used to initialise the superuser on first start. appctl
      # (host-side, 'docker exec') still does every schema/role DDL --
      # the one network client is 'twin' below, and only with a
      # per-tenant schema role, never the superuser (RFC-0031 §7/§8).
      POSTGRES_PASSWORD: "${STORE_SUPERUSER_PASSWORD:-}"
    volumes:
      - "${OAAP_DATA_DIR}/data/store:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No 'ports:' -- deliberate (oaap.data.store 2.1, 4). Still reachable
    # from 'twin' over the compose network by service name; 'ports:'
    # only controls HOST exposure, which stays off.

  # The digital twin (oaap.data.twin 0.1, RFC-0031 Schritt 3) -- the only
  # service an app instance talks to for shared tenant data. Same gate
  # as 'store', because it is nothing without it: no 'store' profile,
  # no twin. Reached through the gateway's '/twin/*' route (Caddyfile),
  # never directly -- an app's own network (RFC-0016) cannot see it.
  twin:
    build: ./services/twin
    profiles: ["store"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        # RFC-0038 D5: Docker keeps container logs without any limit
        # unless told otherwise, and no OAAP node configures a
        # daemon.json. The app containers get this at `docker run`
        # (appctl.CONTAINER_LOG_OPTS); the core services need it
        # spelled out here.
        max-size: "10m"
        max-file: "3"
    depends_on:
      - store
    environment:
      # The third holder of this key, after identity and portal (RFC-0015
      # addendum A4's posture, applied here for Schritt 5, the twin
      # browser): proves a caller of '/internal/*' IS the portal, since
      # the platform network by itself no longer proves anything.
      # '/twin/*' (the gateway route, RFC-0027 keys) needs no part of
      # this and is unaffected.
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:-}"
    volumes:
      # registry.json (whose tenant/app owns which instance) and
      # twin-secrets.json (the per-tenant schema role/password, written
      # by appctl, read by nobody else) -- both read-only, same posture
      # as identity's own '/platform-apps' mount.
      - "${OAAP_DATA_DIR}/apps:/platform-apps:ro"

  # The MQTT broker (oaap.events.broker 0.1, RFC-0032 D2) -- gated by the
  # node profile 'broker' (RFC-0011), INDEPENDENT of 'store': a
  # back-office tenant has a twin but no reason to run real-time
  # messaging. Every CONNECT and every topic action is checked live
  # against identity (mosquitto-go-auth's http backend, see
  # services/broker/mosquitto.conf.template) -- no local password file,
  # no local ACL file. INTERNAL_API_KEY cannot travel as a header here
  # (the plugin sets none), so it travels in the auth URLs' query string
  # instead -- traffic that never leaves this compose network. The
  # config is generated at container start (the key is unknown at image
  # build time) and written to /tmp, which every user this image runs
  # as can write.
  #
  # Only the internal WebSocket listener (9001) is meant to be reached
  # this way, through the gateway's '/broker/*' route (Caddyfile) --
  # like 'twin', an app's own network (RFC-0016) cannot see it directly.
  # The raw device port (1883, no identity by design -- RFC-0015) is
  # published to the host only when this node ALSO carries 'exposed'
  # (docker-compose.broker-exposed.yml, appctl.py's
  # _broker_compose_files()) -- no 'ports:' here on purpose.
  broker:
    image: iegomez/mosquitto-go-auth:3.0.0-mosquitto_2.0.18
    profiles: ["broker"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        # RFC-0038 D5: Docker keeps container logs without any limit
        # unless told otherwise, and no OAAP node configures a
        # daemon.json. The app containers get this at `docker run`
        # (appctl.CONTAINER_LOG_OPTS); the core services need it
        # spelled out here.
        max-size: "10m"
        max-file: "3"
    depends_on:
      - identity
    environment:
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:-}"
    volumes:
      - ./services/broker/mosquitto.conf.template:/mosquitto-template/mosquitto.conf.template:ro
      - "${OAAP_DATA_DIR}/data/broker:/mosquitto/data"
    command:
      - /bin/sh
      - -c
      - sed "s/__INTERNAL_API_KEY__/$$INTERNAL_API_KEY/g" /mosquitto-template/mosquitto.conf.template > /tmp/mosquitto.conf && exec /usr/sbin/mosquitto -c /tmp/mosquitto.conf

  # The outbox relay (oaap.data.twin 0.3, RFC-0032 build order step 2) --
  # the 'twin' image with a different command (services/twin/relay.py).
  # Carries the 'broker' profile, NOT 'store' (Jörg, 2026-09-12): no broker,
  # no relay -- the outbox grows, nothing is lost, the portal says so. On a
  # node with 'broker' but without 'store' it finds no twin schema and idles.
  # Deliberately no 'depends_on: store': a dependency on a service whose
  # profile is not active refuses to start at all. No port, no gateway
  # route -- it only ever calls out, to 'store' and to 'broker'.
  relay:
    build: ./services/twin
    profiles: ["broker"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        # RFC-0038 D5: Docker keeps container logs without any limit
        # unless told otherwise, and no OAAP node configures a
        # daemon.json. The app containers get this at `docker run`
        # (appctl.CONTAINER_LOG_OPTS); the core services need it
        # spelled out here.
        max-size: "10m"
        max-file: "3"
    command: ["python", "-u", "relay.py"]
    depends_on:
      - broker
    environment:
      # Its broker login as the platform principal 'oaap.relay', checked
      # by identity -- the one secret this container holds besides the
      # per-tenant database credentials below.
      BROKER_RELAY_KEY: "${BROKER_RELAY_KEY:-}"
    volumes:
      # twin-secrets.json (every tenant schema's role/password), read-only,
      # the same mount 'twin' already has.
      - "${OAAP_DATA_DIR}/apps:/platform-apps:ro"
